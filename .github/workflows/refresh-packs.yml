# Refresh packs (FEAT-342): bring every published pack up to what main builds, by starting one Build pack run per
# pack. Run by hand, typically at the end of a day after several pipeline PRs merged:
#   gh workflow run refresh-packs.yml                          (needs updating)
#   gh workflow run refresh-packs.yml -f mode=all
#   gh workflow run refresh-packs.yml -f "mode=list only"      (the plan in the run summary, nothing started)
#   or in the Actions tab: Refresh packs > Run workflow.
#
# tools/ci/refresh_packs.py reads catalog.json on main (no static list) and picks the packs whose catalog `pipeline`
# stamp is behind main in a path their build reads (needs updating), or every pack (all). It leaves out, each with a
# reason code in the summary and in the plan artifact: test packs (publish_pack.py --synth) and packs whose
# published menu (attract/, read from the release zip by ranged requests) could not be read (attract_unread).
# A pack whose resorts/<slug>/runner.json says the free runner can't build it (too_big: Vail) is picked by the same
# rules and goes to Drew's PC: the refresh job hands its slug to the pc job (below). A pack published with
# a menu still or ghost takes is started with a note: its build carries the published menu over and keeps the riders
# when the cameras are the same, but a changed pack goes out without its still until a GPU renders one (FEAT-345,
# FEAT-344). Then it dispatches build-pack.yml on main per pack, with
# requested_by refresh-packs and refresh_run this run's id; each build keeps its own queue slot (BUILD_SLOTS at a
# time, shared with hand-started builds), retries, outcome log and publish PR, and this run does not wait for them.
# publish_pack.py publishes nothing when a rebuilt pack's content equals the published one, so a wrong pick costs
# runner time only. The publish PR names this run (`Refresh:`); publish_merge.py trusts the App's automerge label on
# it only when this run is this workflow on main, started by a maintainer, and the build was created while it ran.
#
# Drew's PC (docs/pc-runner.md > Refresh packs and the PC): the PC runner's locks take only a maintainer's dispatch,
# and the workflow token's runs are github-actions[bot]'s, so the pc job starts those builds (build_on pc, the same
# requested_by and refresh_run) with PC_DISPATCH_TOKEN, Drew's fine-grained token (this repo only, Actions read and
# write). The build is then Drew's, so its publish PR is trusted as his. The pc job's summary links each run, says
# when the runner is offline (the build waits in GitHub's queue) and, when the token is missing or refused, gives
# the hand command for each pack. A PC build takes no cloud BUILD_SLOTS slot (wait_turn.py).
#
# Security: the one input is a choice; it reaches the step as an environment variable, never in a `run:` line
# (pipeline/tests/test_workflows.py checks). Only on main, so a changed copy on a branch can't vouch for builds.
# The token is an environment secret of `publish` (main only) and only the pc job's one step names it; the job
# runs nothing but refresh_packs.py --start-pc on main's checkout, with the slugs the refresh job picked.

name: Refresh packs

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Which packs to rebuild
        required: true
        type: choice
        default: needs updating
        options:
          - needs updating
          - all
          - list only

run-name: Refresh packs (${{ inputs.mode }})

permissions:
  contents: read

env:
  MODE: ${{ inputs.mode }}

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write             # start build-pack.yml runs
      contents: read
    outputs:
      pc: ${{ steps.pick.outputs.pc }}     # the slugs for Drew's PC, a JSON list
    steps:
      # full history: the needs-updating pick diffs each pack's stamp against main
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - id: pick
        name: pick and start
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci/refresh_packs.py --json "$RUNNER_TEMP/refresh-plan.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refresh-plan
          path: ${{ runner.temp }}/refresh-plan.json
          if-no-files-found: ignore
          retention-days: 30

  # Drew's PC: the one place PC_DISPATCH_TOKEN is used
  pc:
    needs: refresh
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      needs.refresh.outputs.pc != '' && needs.refresh.outputs.pc != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: publish
      deployment: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: start on Drew's PC
        env:
          GH_TOKEN: ${{ secrets.PC_DISPATCH_TOKEN }}
          PC_SLUGS: ${{ needs.refresh.outputs.pc }}
        run: python tools/ci/refresh_packs.py --start-pc --json "$RUNNER_TEMP/refresh-pc.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refresh-pc
          path: ${{ runner.temp }}/refresh-pc.json
          if-no-files-found: ignore
          retention-days: 30
