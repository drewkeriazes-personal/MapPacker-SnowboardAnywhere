# Build pack (FEAT-245, EPIC-17): one resort in, one publish PR out. The game's Build it button starts it
# (FEAT-246, through the dev server and Drew's gh); by hand:
#   gh workflow run build-pack.yml -f slug=boston-mills -f name="Boston Mills" -f osm_id=<OSM way id>
#   gh workflow run build-pack.yml -f slug=vail            (an existing slug: rebuilt from its committed config)
#   or in the Actions tab: Run workflow, pick the pack in "Rebuild a published pack" (FEAT-297), nothing typed.
#   The list is static (GitHub reads no list at run time): tools/ci/rebuild_choices.py --write rewrites it from
#   catalog.json after a new resort is published.
#
#   queue    BUILD_SLOTS builds at a time (a repo variable, FEAT-342; unset is 1), in the order they were started
#            (tools/ci/wait_turn.py). Not `concurrency`:
#            GitHub keeps one pending run per group and cancels the older pending one, so a third build would drop
#            the second.
#   probe    one small request to every data host the build calls (tools/ci/probe_hosts.py); a host that is down
#            fails here, in a minute, instead of hours into the fetch. FEAT-347: when the raw-data cache covers
#            every raw folder of a rebuild on the free runner (tools/ci/raw_cache.py covered: each cache.json's data
#            stage fingerprints are main's, and fresh_data is off), the build fetches nothing, so every host but
#            OpenSkiData (the published stage) warns instead of failing
#   build    tools/ci/build_pack_ci.py, one step per stage (resolve, fetch, build, report, publish; the game reads
#            the step names for progress, FEAT-247, and the run summary has a line per stage). A new slug is
#            resolved and planned from the OSM id (resort.py add --osm, --alone); an existing one is rebuilt from
#            resorts/<slug>/, never skipped for being in the catalog. No ride. On the free runner attract and
#            spots skip: there is no game (publish design section 5); on Drew's PC (build_on: pc) they run, on the
#            GPU, against a checkout of the game's main. publish_pack.py opens the publish PR with the
#            App token, labelled automerge when the run's triggering actor is in .github/maintainers.txt, and
#            publishes nothing when the pack's content equals the published version's or an open publish PR's.
#            Never a push to main.
#            FEAT-346, on the free runner: `restore` before the fetch puts back each raw folder the build reads
#            from its draft release `raw/<folder>`, and `save` after it uploads a folder whose data changed
#            (tools/ci/raw_cache.py), so a rebuild downloads only what the manifest now wants made differently
#            (pipeline/fetch_index.py). fresh_data skips the restore. Neither step fails the build.
#   retries  FEAT-314, in layers: the probe and the fetch first retry a flaky call inline (pipeline/retry.json: no
#            answer, 429, 5xx; never a 4xx), each with its own caps, and log the tries per host to SBA_RETRY_LOG
#            (an artifact per job, read by the outcome job); only a host down for minutes fails the job.
#   outcome  every attempt, pass or fail (FEAT-314): tools/ci/build_failures.py record sorts a failure into a reason
#            code, logs the attempt on the `metrics` branch (build-failures.jsonl, README.md, host-tuning.json) and,
#            for a transient cause on attempt 1 or 2, starts build-pack-retry.yml, which re-runs the failed jobs
#            after 5, then 15 minutes. A real cause stops with its reason, except a build_on: pc run's first
#            attempt, re-run once for any cause a re-run can change (FEAT-388). Never fails the run itself.
#
# Security: the inputs are untrusted text. They reach steps only as environment variables, never in a `run:`
# line (pipeline/tests/test_workflows.py checks), and build_pack_ci.py inputs refuses any outside their shapes
# first. The LANDFIRE email is a secret in the env of the fetch step only (BUG-111: never an argument). The App
# token is minted just before the step that uses it (it lasts an hour; builds take longer) and only that step
# holds it: publish, on the free runner the raw cache's restore and save, and in the probe job the raw cache's
# coverage check (contents: write only: a draft release is visible only with push access).
# BUG-113: only the probe and build jobs name the environment `publish` that holds those secrets, and the
# environment lets only main use it, so a run dispatched on any other branch is refused at the probe job, before
# a step runs.
#
# Limits: the free runner (about 14 GB disk before the clean-up below, 16 GB RAM, 6 hours a job). A resort too big
# for it, or one whose menu still and ghosts need the GPU, is built with build_on: pc (FEAT-344): the build job runs
# on the self-hosted runner on Drew's PC (labels self-hosted, windows, sba-pc; setup in docs/pc-runner.md), with the
# raw data already there (SBA_RAW_ROOTS in the runner's .env) and plain python, and ends in the same publish PR.
#
# The PC runner and a public repo (FEAT-344): a self-hosted runner must never run a pull request's code or a
# branch's edited workflow. Three locks, each enough on its own for the case it covers:
#   1. the probe job's `where` step (build_pack_ci.py where) refuses build_on: pc unless the run is a
#      workflow_dispatch on refs/heads/main whose actor is in .github/maintainers.txt; only then is runner 'pc'
#   2. the build job's `if:` takes the PC only for runner 'pc' and a workflow_dispatch on refs/heads/main
#   3. the runner's job-started hook on the PC (tools/pc-runner/job_started.ps1, copied outside every checkout so
#      no PR can edit it) fails any job that is not this workflow, from main, dispatched by a maintainer. Locks 1
#      and 2 live in this file, so they hold only for this file on main; lock 3 also stops a fork PR that edits a
#      workflow to ask for the sba-pc label. Fork PR runs also wait for approval (repo setting, docs/pc-runner.md).
# The queue (wait_turn.py): a PC run takes no BUILD_SLOTS slot and never waits there (the runner takes one job at a
# time, GitHub queues the rest), and a cloud run does not wait for a run building on the PC (docs/pc-runner.md).
# Refresh packs starts a too_big pack here with build_on pc, as Drew (PC_DISPATCH_TOKEN), so the locks hold as they are.
# Setup: secrets PUBLISH_APP_ID, PUBLISH_APP_KEY, LANDFIRE_EMAIL in the environment `publish` (BUG-113: deployment
# branches main only, so a branch's copy of this file can't read them); variable PUBLISH_APP_LOGIN (publish-merge.yml).

name: Build pack

on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: Rebuild a published pack (FEAT-297). Leave the first entry to build from the slug typed below
        required: false
        type: choice
        default: '(new resort: type the slug below)'
        options:
          # rebuild_choices.py writes this list from catalog.json
          - '(new resort: type the slug below)'
          - aspen-snowmass
          - beaver-creek-resort-arrowhead-mountain
          - bigsky
          - boston-mills
          - breckenridge
          - copper-mountain
          - crystal-mountain
          - deer-valley
          - heavenly
          - jackson-hole-mountain
          - keystone
          - killington
          - mont-tremblant-resort-station-mont-tremblant
          - mount-bohemia
          - ohio-hills
          - park-city-mountain
          - snowbird
          - vail
          - whistler-blackcomb
      slug:
        description: Pack slug, for a new resort (an existing one is rebuilt); not needed when a pack is picked above
        required: false
        type: string
      name:
        description: Resort name (a new slug)
        required: false
        type: string
      osm_id:
        description: OSM id of the ski area picked in the game (a new slug), e.g. 123456 or way/123456; skimap/497 for one with no OSM outline
        required: false
        type: string
      requested_by:
        description: The game account that asked (FEAT-273), written into the publish PR
        required: false
        type: string
      build_on:
        description: "Where the build runs (FEAT-344): cloud, the free runner; pc, Drew's PC (big packs, the GPU menu still). pc runs only from main, started by a maintainer"
        required: false
        type: choice
        default: cloud
        options:
          - cloud
          - pc
      refresh_run:
        description: The Refresh packs run that started this build (FEAT-342); set by refresh-packs.yml, leave empty
        required: false
        type: string
      fresh_data:
        description: "Download all the raw data again (FEAT-346): skips the free runner's raw-data cache; the build then saves what it fetched"
        required: false
        type: boolean
        default: false

run-name: Build pack ${{ inputs.slug || inputs.rebuild }}

permissions:
  contents: read

env:
  SLUG: ${{ inputs.slug }}
  REBUILD: ${{ inputs.rebuild }}
  NAME: ${{ inputs.name }}
  OSM_ID: ${{ inputs.osm_id }}
  REQUESTED_BY: ${{ inputs.requested_by }}
  BUILD_ON: ${{ inputs.build_on }}
  REFRESH_RUN: ${{ inputs.refresh_run }}
  FRESH_DATA: ${{ inputs.fresh_data }}

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: wait for the builds started before this one
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SLOTS: ${{ vars.BUILD_SLOTS }}
        run: python tools/ci/wait_turn.py

  probe:
    needs: queue
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      runner: ${{ steps.where.outputs.runner }}     # cloud or pc (FEAT-344): pc only after build_pack_ci.py where's checks
    # FEAT-347: the App's secrets, for the raw cache's cache.json (a draft: only push access reads it); BUG-113's
    # main-only environment, so a run on another branch is refused here
    environment:
      name: publish
      deployment: false
    env:
      SBA_RETRY_LOG: /home/runner/inline-retries.jsonl
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: inputs
        run: python tools/ci/build_pack_ci.py check
      - id: where
        name: where it builds
        run: python tools/ci/build_pack_ci.py where
      # FEAT-314: the timeouts build_failures.py raised for hosts that keep timing out (none yet: the defaults)
      - name: learned timeouts
        run: |
          if git fetch -q --depth 1 origin metrics; then git show FETCH_HEAD:host-tuning.json > "$RUNNER_TEMP/host-tuning.json" || true; fi
          cat "$RUNNER_TEMP/host-tuning.json" 2>/dev/null || echo "no host-tuning.json: the defaults"
      # FEAT-347: a rebuild whose raw-data cache covers every folder it reads fetches nothing, so the probe lets
      # the hosts only the data stages call warn instead of fail (raw_cache.py covered reads only cache.json; any
      # miss or error writes no file, and every host is required as before). pip: build_resort.py's stage
      # fingerprints read gen_manifest.py, which imports pyproj
      - run: python -m pip install -r pipeline/requirements.txt
        continue-on-error: true
      - id: cache_token
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PUBLISH_APP_ID }}
          private-key: ${{ secrets.PUBLISH_APP_KEY }}
          permission-contents: write
      - name: raw cache
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.cache_token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: python tools/ci/raw_cache.py covered --out "$RUNNER_TEMP/raw-cache-covers.json"
      - name: data hosts
        run: python tools/ci/probe_hosts.py --tuning "$RUNNER_TEMP/host-tuning.json" --raw-cache "$RUNNER_TEMP/raw-cache-covers.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inline-retries-probe-${{ github.run_attempt }}
          path: /home/runner/inline-retries.jsonl
          if-no-files-found: ignore
          retention-days: 7

  build:
    needs: probe
    # FEAT-344: Drew's PC only for a run the where step let through, and only a workflow_dispatch on main (lock 2
    # at the top). Keep the job name `build`: the game's build progress reads it (game/tools/build_progress.mjs).
    if: >-
      needs.probe.outputs.runner == 'cloud' ||
      (needs.probe.outputs.runner == 'pc' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ${{ needs.probe.outputs.runner == 'pc' && fromJSON('["self-hosted", "windows", "sba-pc"]') || 'ubuntu-latest' }}
    timeout-minutes: ${{ needs.probe.outputs.runner == 'pc' && 1440 || 350 }}
    # BUG-113: the App's secrets and LANDFIRE_EMAIL are environment secrets of `publish`, which only main may use
    # (Security at the top); no deployment record per build
    environment:
      name: publish
      deployment: false
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        shell: bash           # on Windows the runner uses Git for Windows' bash
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # BUG-172: Python reads and writes UTF-8 on the Windows runner too (a pipe there is cp1252, which has no "✓")
      PYTHONUTF8: "1"
    steps:
      # where the retry log and the OpenSkiData index go, per runner (the PC's index: pc setup below)
      - name: paths
        run: |
          echo "SBA_RETRY_LOG=$RUNNER_TEMP/inline-retries.jsonl" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = Linux ]; then echo "SBA_INDEX_DIR=/home/runner/osd-index" >> "$GITHUB_ENV"; fi
      - name: disk
        if: runner.os == 'Linux'
        run: |
          df -h / /mnt || true
          # preinstalled toolsets the build never uses (about 30 GB)
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          root=$(df --output=avail -B1 / | tail -1)
          mnt=$(df --output=avail -B1 /mnt 2>/dev/null | tail -1 || echo 0)
          if [ "${mnt:-0}" -gt "$root" ]; then
            sudo mkdir -p /mnt/sba-raw && sudo chown "$USER" /mnt/sba-raw
            echo "SBA_RAW_ROOT=/mnt/sba-raw" >> "$GITHUB_ENV"
          else
            mkdir -p "$HOME/sba-raw" && echo "SBA_RAW_ROOT=$HOME/sba-raw" >> "$GITHUB_ENV"
          fi
          df -h / /mnt || true

      # main, so the pack's pipeline stamp is a commit on origin/main (publish_pack refuses anything else). Full
      # history for publish_pack's git worktree; no credentials kept: only the publish step can push.
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      # FEAT-344: on Drew's PC the game's main, for the attract and spots stages (the game's own tools, on the GPU);
      # never Drew's own checkout, which may be on any branch. Removed with the rest by the next run's checkout.
      - uses: actions/checkout@v6
        if: runner.os == 'Windows'
        with:
          repository: drewkeriazes-personal/SnowboardAnywhere
          ref: main
          path: sba-game
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'      # the PC's own python (and the packages it already has)
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: python -m pip install -r pipeline/requirements.txt
      # again: "Re-run failed jobs" skips a queue job that passed, so a re-run must not jump the queue here
      - name: still my turn
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SLOTS: ${{ vars.BUILD_SLOTS }}
        run: python tools/ci/wait_turn.py
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: '22'
      - name: game
        if: runner.os == 'Windows'
        working-directory: sba-game/game
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium
      - name: pc setup
        if: runner.os == 'Windows'
        env:
          GAME_CHECKOUT: ${{ github.workspace }}/sba-game
        run: python tools/ci/build_pack_ci.py pc-setup

      - id: inputs
        name: inputs
        run: python tools/ci/build_pack_ci.py inputs

      # resolve, plan and the published stage (FEAT-293, BUG-124: every build) read OpenSkiData's index files
      # (runs.geojson is about 800 MB); resort.py downloads them again after 30 days, so a monthly key
      - id: month
        if: runner.os == 'Linux'
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: runner.os == 'Linux'
        with:
          path: /home/runner/osd-index
          key: openskidata-index-${{ steps.month.outputs.month }}
          restore-keys: openskidata-index-

      - name: resolve
        run: python tools/ci/build_pack_ci.py resolve
      # FEAT-346: the free runner starts empty; Drew's PC keeps its raw data on disk. No App: a miss, the fetch
      # downloads it all
      - id: restore_token
        if: runner.os == 'Linux'
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PUBLISH_APP_ID }}
          private-key: ${{ secrets.PUBLISH_APP_KEY }}
          permission-contents: write
      - name: restore
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ steps.restore_token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: python tools/ci/raw_cache.py restore
      - id: fetch
        name: fetch
        env:
          LANDFIRE_EMAIL: ${{ secrets.LANDFIRE_EMAIL }}
        run: python tools/ci/build_pack_ci.py fetch
      # FEAT-349: the save runs after a failed fetch too (the fetch ran: success or failure), so a retry restores what
      # came and fetches only the rest; the job still fails on the fetch
      - id: save_token
        if: runner.os == 'Linux' && !cancelled() && contains(fromJSON('["success", "failure"]'), steps.fetch.outcome)
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PUBLISH_APP_ID }}
          private-key: ${{ secrets.PUBLISH_APP_KEY }}
          permission-contents: write
      - name: save
        if: runner.os == 'Linux' && !cancelled() && contains(fromJSON('["success", "failure"]'), steps.fetch.outcome)
        env:
          GH_TOKEN: ${{ steps.save_token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: python tools/ci/raw_cache.py save
      - name: build
        run: python tools/ci/build_pack_ci.py build
      - name: report
        run: python tools/ci/build_pack_ci.py report
      # FEAT-344: the spots stage's proposed compare spots land in the game checkout's docs/compare/<slug>/ (only for
      # a resort with none on the game's main); here for Drew to add to the game with their Street View links
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: compare-spots-${{ github.run_attempt }}
          path: sba-game/docs/compare/${{ steps.inputs.outputs.slug }}
          if-no-files-found: ignore
          retention-days: 30

      - name: the App is set up
        env:
          APP_ID: ${{ secrets.PUBLISH_APP_ID }}
          APP_KEY: ${{ secrets.PUBLISH_APP_KEY }}
          APP_LOGIN: ${{ vars.PUBLISH_APP_LOGIN }}
        run: |
          missing=""
          [ -n "$APP_ID" ] || missing="$missing secret:PUBLISH_APP_ID"
          [ -n "$APP_KEY" ] || missing="$missing secret:PUBLISH_APP_KEY"
          [ -n "$APP_LOGIN" ] || missing="$missing variable:PUBLISH_APP_LOGIN"
          if [ -n "$missing" ]; then
            echo "::error::Publishing needs the GitHub App (FEAT-272). Missing:$missing. See the top of .github/workflows/publish-merge.yml."
            exit 1
          fi
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PUBLISH_APP_ID }}
          private-key: ${{ secrets.PUBLISH_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: publish
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          APP_LOGIN: ${{ vars.PUBLISH_APP_LOGIN }}
        run: |
          # the publish commit and push are the App's, so the PR's Checks run and publish-merge trusts it. On Drew's PC
          # (FEAT-344) this step's git gets a global config of its own, so gh auth setup-git leaves his alone; the
          # empty helper gh writes first resets the system config's Git Credential Manager, so nothing pushes as him
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/publish.gitconfig"
            : > "$GIT_CONFIG_GLOBAL"
          fi
          gh auth setup-git
          id=$(gh api "users/$APP_LOGIN" --jq .id)
          git config user.name "$APP_LOGIN"
          git config user.email "$id+$APP_LOGIN@users.noreply.github.com"
          python tools/ci/build_pack_ci.py publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inline-retries-build-${{ github.run_attempt }}
          path: ${{ env.SBA_RETRY_LOG }}
          if-no-files-found: ignore
          retention-days: 7

  outcome:
    needs: [queue, probe, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write             # read the jobs and their logs, start build-pack-retry.yml
      contents: write            # the metrics branch only (never main: build_failures.py pushes HEAD:metrics)
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # this attempt's inline retries (the jobs that ran in it)
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: inline-retries-*-${{ github.run_attempt }}
          path: /home/runner/inline
      - name: classify, log and retry
        continue-on-error: true  # a metrics hiccup never turns a passed build red
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INLINE_DIR: /home/runner/inline
        run: |
          gh auth setup-git
          python tools/ci/build_failures.py record
